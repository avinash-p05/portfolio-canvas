<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Avinash Pauskar · Full-Stack Engineer</title>
    <meta
      name="description"
      content="The portfolio of Avinash Pauskar, a full-stack engineer working with Java, Spring Boot, React and AI, laid out as an infinite canvas you can explore."
    />
    <meta name="author" content="Avinash Pauskar" />
    <meta name="theme-color" content="#5b5bf7" />
    <link rel="canonical" href="https://avinash-pauskar.netlify.app/" />

    <!--
      Link previews on LinkedIn, X, Slack, WhatsApp and others. Image URLs must be absolute.
      If you fork this, change the URLs to your own domain. The image's source is scripts/og-image.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avinash Pauskar" />
    <meta property="og:url" content="https://avinash-pauskar.netlify.app/" />
    <meta property="og:title" content="Avinash Pauskar · Full-Stack Engineer" />
    <meta
      property="og:description"
      content="My portfolio as an infinite canvas. Pan, zoom and follow my live cursor around my work, projects and hackathon wins."
    />
    <meta property="og:image" content="https://avinash-pauskar.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Avinash Pauskar's portfolio: an intro card, hackathon sticky notes and a live cursor on a dotted canvas."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avinash Pauskar · Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="My portfolio as an infinite canvas. Pan, zoom and follow my live cursor."
    />
    <meta name="twitter:image" content="https://avinash-pauskar.netlify.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the theme before first paint so dark-mode visitors don't see a light flash.
      // Keep in sync with src/hooks/useTheme.ts.
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Karla:wght@400;500;600&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify detects forms by scanning the deployed HTML, which never contains the React-rendered
      dialog. This hidden copy registers the "edit-request" form and its fields. Keep the name and
      field names in sync with src/chrome/RequestAccessDialog.tsx.
    -->
    <form name="edit-request" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="email" name="email" />
      <textarea name="note"></textarea>
      <input name="company" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
