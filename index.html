<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avinash Pauskar | Terminal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0a0e14;
      --surface:   #111822;
      --border:    #1e2a3a;
      --text:      #c5cdd9;
      --accent:    #39ff14;
      --accent2:   #00e5ff;
      --yellow:    #ffcc00;
      --orange:    #ff9f43;
      --pink:      #ff6b81;
      --purple:    #c678dd;
      --muted:     #5c6773;
      --prompt:    #39ff14;
      --font:      'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    html { font-size: 15px; }

    body {
      background: var(--bg);
      background-image: url('ubuntu.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 4rem 2rem 8rem;
      overflow-x: hidden;
    }

    .desktop-icons {
      position: fixed;
      z-index: 1;
      top: 42px;
      left: 76px;
      display: grid;
      grid-template-columns: repeat(2, 104px);
      gap: 18px 14px;
      max-height: calc(100vh - 4rem);
    }
    .desktop-icon {
      appearance: none;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #dce8f0;
      font: 500 0.68rem/1.25 var(--font);
      padding: 5px 3px;
      text-align: center;
      text-shadow: 0 2px 3px #000;
    }
    .desktop-icon:hover {
      background: rgba(0, 229, 255, 0.14);
      border-color: rgba(0, 229, 255, 0.45);
    }
    .desktop-icon::before {
      content: '📄';
      display: block;
      font-size: 2.3rem;
      line-height: 1;
      margin-bottom: 5px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.55));
    }
    .desktop-icon.folder::before { content: '📁'; }
    .desktop-icon span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Scanline overlay ────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: none;
      pointer-events: none;
      z-index: 9999;
    }

    .ubuntu-topbar { position: fixed; z-index: 5; inset: 0 0 auto; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(34, 34, 34, .92); color: #fff; font: 600 .75rem system-ui, sans-serif; }
    .topbar-section { display: flex; align-items: center; gap: 13px; }
    .ubuntu-dock { position: fixed; z-index: 4; top: 42px; bottom: 16px; left: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 10px; background: rgba(28, 28, 28, .73); }
    .dock-icon { width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; border: 0; border-radius: 7px; background: transparent; color: #fff; font-size: 1.55rem; }
    .dock-icon:hover, .dock-icon.active { background: rgba(255, 255, 255, .15); }
    .dock-separator { width: 27px; border-top: 1px solid rgba(255, 255, 255, .26); margin: 2px 0; }

    /* ── Terminal Window ─────────────────────────────────── */
    #terminal-window {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100vw - 13rem));
      max-width: none;
      background: #2d2d2d;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.58);
      transition: width .2s ease, height .2s ease, transform .2s ease, opacity .2s ease;
    }
    #terminal-window.maximized { position: fixed; inset: 30px 0 0 70px; width: auto; height: calc(100vh - 30px); border-radius: 0; }
    #terminal-window.maximized #terminal { height: calc(100vh - 74px); }
    #terminal-window.minimized { position: fixed; right: 16px; bottom: 16px; width: 260px; transform: none; opacity: .92; }
    #terminal-window.minimized #terminal { display: none; }

    /* ── Title Bar ───────────────────────────────────────── */
    #title-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #0d1117;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      user-select: none;
    }

    #title-bar { padding: 7px 10px; background: linear-gradient(#464646, #373737); gap: 6px; }
    .window-controls { display: flex; gap: 3px; }
    .window-control { width: 19px; height: 19px; display: grid; place-items: center; cursor: pointer; border: 0; border-radius: 50%; color: #333; font: 700 .8rem system-ui, sans-serif; }
    .control-minimize { background: #f6c344; }
    .control-maximize { background: #64c466; }
    .control-close { background: #ef6b62; }

    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .tl-red    { background: #ff5f56; }
    .tl-yellow { background: #ffbd2e; }
    .tl-green  { background: #27c93f; }

    #title-bar span {
      flex: 1;
      text-align: center;
      color: #e9e9e9;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    /* ── Terminal Body ───────────────────────────────────── */
    #terminal {
      padding: 1.2rem 1.4rem;
      height: min(72vh, 760px);
      overflow-y: auto;
      scroll-behavior: smooth;
      line-height: 1.7;
      font-size: 0.92rem;
    }

    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── Output Sections ─────────────────────────────────── */
    .line { white-space: pre-wrap; word-wrap: break-word; }
    .line.blank { height: 0.5rem; }

    .prompt-prefix {
      color: var(--accent);
      font-weight: 600;
    }

    .cmd-text { color: var(--accent2); }

    .section-title {
      color: var(--yellow);
      font-weight: 700;
      font-size: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 6px;
      display: inline-block;
    }

    .highlight  { color: var(--accent); }
    .accent2    { color: var(--accent2); }
    .yellow     { color: var(--yellow); }
    .orange     { color: var(--orange); }
    .pink       { color: var(--pink); }
    .purple     { color: var(--purple); }
    .muted      { color: var(--muted); }
    .bold       { font-weight: 700; }

    a {
      color: var(--accent2);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent2);
      transition: color 0.2s;
    }
    a:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Input Line ──────────────────────────────────────── */
    #input-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }

    #input-line .prompt-prefix { flex-shrink: 0; }

    #cmd-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--accent2);
      font-family: var(--font);
      font-size: 0.92rem;
      caret-color: var(--accent);
      margin-left: 4px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0.8rem 0 0.25rem;
    }
    .quick-command {
      appearance: none;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(0, 229, 255, 0.06);
      color: var(--accent2);
      font: 500 0.78rem var(--font);
      padding: 5px 8px;
    }
    .quick-command:hover { border-color: var(--accent2); color: var(--accent); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Typing effect cursor ────────────────────────────── */
    .typing-cursor {
      display: inline-block;
      width: 8px;
      background: var(--accent);
      animation: blink 0.8s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* ── ASCII Art ────────────────────────────────────────── */
    .ascii-art {
      color: var(--accent);
      font-size: 0.72rem;
      line-height: 1.25;
      letter-spacing: 1px;
    }

    /* ── Welcome box ─────────────────────────────────────── */
    .welcome-box {
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      margin: 8px 0;
      background: rgba(57, 255, 20, 0.03);
    }

    /* ── Table-like layouts ───────────────────────────────── */
    .info-row {
      display: flex;
      gap: 12px;
      padding: 2px 0;
    }
    .info-label {
      color: var(--yellow);
      min-width: 160px;
      flex-shrink: 0;
    }

    .skill-tag {
      display: inline-block;
      background: rgba(57, 255, 20, 0.08);
      border: 1px solid rgba(57, 255, 20, 0.2);
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px 3px;
      font-size: 0.82rem;
      color: var(--accent);
    }

    .skill-category {
      color: var(--orange);
      font-weight: 600;
      margin-top: 6px;
    }

    .project-card {
      border-left: 3px solid var(--accent2);
      padding: 6px 0 6px 14px;
      margin: 8px 0;
    }

    .exp-card {
      border-left: 3px solid var(--purple);
      padding: 6px 0 6px 14px;
      margin: 8px 0;
    }

    .edu-card {
      border-left: 3px solid var(--yellow);
      padding: 6px 0 6px 14px;
      margin: 8px 0;
    }

    .achievement-item {
      padding: 2px 0;
    }
    .achievement-item::before {
      content: '🏆 ';
    }

    /* ── Neofetch layout ─────────────────────────────────── */
    .neofetch-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .neofetch-ascii {
      color: var(--accent);
      font-size: 0.65rem;
      line-height: 1.2;
      flex-shrink: 0;
    }
    .neofetch-info {
      line-height: 1.65;
    }
    .neofetch-separator {
      color: var(--border);
    }
    .neofetch-colors {
      display: flex; gap: 2px; margin-top: 4px;
    }
    .neofetch-colors span {
      width: 22px; height: 12px; display: inline-block; border-radius: 2px;
    }

    /* ── Tree view ────────────────────────────────────────── */
    .tree-line {
      color: var(--muted);
    }
    .tree-folder { color: var(--accent2); font-weight: 600; }
    .tree-file   { color: var(--text); }

    /* ── Top / htop table ─────────────────────────────────── */
    .top-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .top-table th {
      color: var(--bg);
      background: var(--accent);
      padding: 2px 10px;
      text-align: left;
      font-weight: 600;
    }
    .top-table td {
      padding: 2px 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Cowsay ───────────────────────────────────────────── */
    .cowsay-box {
      color: var(--yellow);
    }
    .cowsay-cow {
      color: var(--text);
    }

    /* ── Progress bar ────────────────────────────────────── */
    .progress-bar {
      display: inline-block;
      background: var(--border);
      border-radius: 3px;
      width: 120px;
      height: 10px;
      overflow: hidden;
      vertical-align: middle;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 900px) {
      body { padding: 3rem 1rem 1rem 6rem; }
      #terminal-window { border-radius: 8px; }
      #terminal-window { width: calc(100vw - 7rem); }
      .desktop-icons { left: 72px; top: 42px; grid-template-columns: repeat(2, 92px); gap: 10px; opacity: 0.88; }
      .desktop-icon { font-size: 0.58rem; }
      .desktop-icon::before { font-size: 1.7rem; }
    }

    @media (max-width: 600px) {
      html { font-size: 13px; }
      body {
        padding: 2.8rem 0.5rem 0.5rem;
        background-attachment: scroll; /* fixed breaks on iOS */
        background-position: center top;
      }
      #terminal-window {
        border-radius: 6px;
        max-width: 100%;
      }
      #terminal { padding: 0.8rem; height: 85vh; }
      .desktop-icons { display: none; }
      .ubuntu-dock { display: none; }
      .ubuntu-topbar { height: 28px; }
      #terminal-window { width: 100%; }
      #terminal-window.maximized { inset: 28px 0 0; }
      .info-label { min-width: 110px; }
      .ascii-art { font-size: 0.55rem; }
      .neofetch-container { flex-direction: column; gap: 8px; }
      .neofetch-ascii { font-size: 0.5rem; }
    }

    @media (max-width: 380px) {
      html { font-size: 12px; }
      body { padding: 0.25rem; }
      #terminal { padding: 0.6rem; height: 88vh; }
      .info-label { min-width: 90px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

// ── Helpers ───────────────────────────────────────────────
function appendHTML(html) {
  const div = document.createElement('div');
  div.classList.add('line');
  div.innerHTML = html;
  output.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  terminal.scrollTop = terminal.scrollHeight;
}

function processCommand(raw) {
  let cmd = raw.trim().toLowerCase();
  if (!cmd) return;

  const aliases = { project: 'projects', work: 'experience', resume: 'wget resume', linkedin: 'social' };
  cmd = aliases[cmd] || cmd;

  // Echo the command
  appendHTML(`<span class="prompt-prefix">visitor@avinash:~$</span> <span class="cmd-text">${escapeHTML(raw)}</span>`);

  // Save history
  commandHistory.push(raw);
  historyIndex = commandHistory.length;

  if (cmd === 'clear') {
    output.innerHTML = '';
    appendHTML(WELCOME);
    return;
  }

  // ── Direct command match ──
  const handler = COMMANDS[cmd];
  if (handler) {
    appendHTML(handler());
    appendHTML('');
    return;
  }

  // ── Parametric commands ──

  // echo <message>
  if (cmd.startsWith('echo ')) {
    const msg = raw.trim().substring(5);
    appendHTML(`<span class="text">${escapeHTML(msg)}</span>`);
    appendHTML('');
    return;
  }

  // cat <filename>
  if (cmd.startsWith('cat ')) {
    const filename = cmd.substring(4).trim();
    const file = FILES[filename];
    if (file) {
      appendHTML(file());
    } else {
      appendHTML(`<span class="pink">cat: ${escapeHTML(filename)}: No such file or directory</span>\n<span class="muted">Available files: ${Object.keys(FILES).join(', ')}</span>`);
    }
    appendHTML('');
    return;
  }

  // cowsay <message>
  if (cmd.startsWith('cowsay')) {
    const msg = raw.trim().substring(6).trim() || 'Hire Avinash!';
    const border = '─'.repeat(msg.length + 2);
    appendHTML(`<span class="cowsay-box"> ┌${border}┐\n │ ${escapeHTML(msg)} │\n └${border}┘</span>\n<span class="cowsay-cow">        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||</span>`);
    appendHTML('');
    return;
  }

  // sudo <anything>
  if (cmd.startsWith('sudo ')) {
    appendHTML(`<span class="pink bold">⚠ Permission denied.</span>\n<span class="muted">Nice try! But this terminal runs in user mode only.</span>\n<span class="muted">Avinash is the only sudoer here. 😏</span>`);
    appendHTML('');
    return;
  }

  // uname
  if (cmd === 'uname' || cmd === 'uname -a') {
    appendHTML(`<span class="text">AvinashOS 4.0.0-portfolio #1 SMP ${new Date().toDateString()} x86_64 GNU/Linux</span>`);
    appendHTML('');
    return;
  }

  // pip list
  if (cmd === 'pip list' || cmd === 'pip3 list') {
    appendHTML(`<span class="bold highlight">Package              Version    Status</span>\n<span class="neofetch-separator">────────────────────────────────────────────</span>\njava                 17.0.2     <span class="highlight">✓ installed</span>\nhtml-css             5.3.0      <span class="highlight">✓ installed</span>\njavascript-es6       2024.1     <span class="highlight">✓ installed</span>\nspring-boot          3.2.0      <span class="highlight">✓ installed</span>\nreact                18.2.0     <span class="highlight">✓ installed</span>\nnodejs               20.10.0    <span class="highlight">✓ installed</span>\nexpress              4.18.2     <span class="highlight">✓ installed</span>\ndocker               24.0.7     <span class="highlight">✓ installed</span>\nmongodb-driver       4.11.0     <span class="highlight">✓ installed</span>\nmysql-connector      8.2.0      <span class="highlight">✓ installed</span>\npostgresql           16.1       <span class="highlight">✓ installed</span>\naws-sdk              3.450.0    <span class="highlight">✓ installed</span>\nfigma-plugin         1.0.0      <span class="highlight">✓ installed</span>\n\n<span class="muted">[13 packages installed]</span>`);
    appendHTML('');
    return;
  }

  // npm list
  if (cmd === 'npm list' || cmd === 'npm ls') {
    appendHTML(`<span class="accent2">avinash-portfolio@2.0.0</span> /home/avinash/portfolio\n├── <span class="highlight">react</span>@18.2.0\n├── <span class="highlight">react-dom</span>@18.2.0\n├── <span class="highlight">node</span>@20.10.0\n├── <span class="highlight">express</span>@4.18.2\n├── <span class="highlight">mongodb</span>@6.3.0\n├── <span class="highlight">spring-boot-starter</span>@3.2.0\n├── <span class="highlight">aws-sdk</span>@3.450.0\n├── <span class="highlight">docker</span>@24.0.7\n├── <span class="highlight">jetpack-compose</span>@1.5.4\n├── <span class="highlight">kotlin</span>@1.9.21\n├── <span class="highlight">gradle</span>@8.5.0\n├── <span class="highlight">maven</span>@3.9.6\n└── <span class="highlight">jenkins</span>@2.426.1\n\n<span class="muted">13 packages, 0 vulnerabilities</span>`);

  // apt list
  if (cmd === 'apt list' || cmd === 'apt list --installed') {
    appendHTML(`<span class="muted">Listing installed packages...</span>\n\n<span class="highlight">java/stable</span>           17.0.2-1   amd64  [installed]\n<span class="highlight">nodejs/stable</span>         20.10.0-1  amd64  [installed]\n<span class="highlight">docker-ce/stable</span>      24.0.7-1   amd64  [installed]\n<span class="highlight">mongodb-org/stable</span>    7.0.4-1    amd64  [installed]\n<span class="highlight">mysql-server/stable</span>   8.2.0-1    amd64  [installed]\n<span class="highlight">postgresql/stable</span>     16.1-1     amd64  [installed]\n<span class="highlight">git/stable</span>            2.43.0-1   amd64  [installed]\n<span class="highlight">gradle/stable</span>         8.5.0-1    amd64  [installed]\n<span class="highlight">maven/stable</span>          3.9.6-1    amd64  [installed]\n<span class="highlight">jenkins/stable</span>        2.426.1-1  amd64  [installed]\n<span class="highlight">postman/stable</span>        10.21.0-1  amd64  [installed]\n<span class="highlight">figma-linux/stable</span>    0.11.4-1   amd64  [installed]\n\n<span class="muted">12 packages installed.</span>`);
    appendHTML('');
    return;
  }

  // brew list
  if (cmd === 'brew list') {
    appendHTML(`<span class="muted">==> Formulae</span>\n<span class="highlight">git</span>  <span class="highlight">gradle</span>  <span class="highlight">maven</span>  <span class="highlight">node</span>  <span class="highlight">docker</span>  <span class="highlight">mongodb-community</span>  <span class="highlight">postgresql@16</span>  <span class="highlight">openjdk@17</span>\n\n<span class="muted">==> Casks</span>\n<span class="accent2">visual-studio-code</span>  <span class="accent2">android-studio</span>  <span class="accent2">intellij-idea</span>  <span class="accent2">postman</span>  <span class="accent2">figma</span>  <span class="accent2">docker-desktop</span>`);
    appendHTML('');
    return;
  }

  // wget resume
  if (cmd === 'wget resume' || cmd === 'wget resume.pdf' || cmd === 'curl resume' || cmd === 'download resume') {
    appendHTML(`<span class="muted">--${new Date().toISOString()}--  https://avinash-pauskar-portfolio.netlify.app/Avinash_Pauskar_Resume.pdf</span>\n<span class="muted">Resolving avinash-pauskar-portfolio.netlify.app... </span><span class="highlight">connected.</span>\n<span class="muted">HTTP request sent, awaiting response... </span><span class="highlight">200 OK</span>\n<span class="muted">Length: 100859 (98K) [application/pdf]</span>\n<span class="muted">Saving to: 'Avinash_Pauskar_Resume.pdf'</span>\n\n<span class="highlight">Avinash_Pauskar_Resume 100%[==================>]  98.50K  --.-KB/s  in 0.1s</span>\n\n<span class="highlight bold">✓ Resume downloaded!</span>\n<span class="muted">📧 Or email </span><a href="mailto:avinashpauskar05@gmail.com">avinashpauskar05@gmail.com</a><span class="muted"> for the latest copy.</span>`);
    // Trigger actual file download
    const a = document.createElement('a');
    a.href = 'Avinash_Pauskar_Resume.pdf';
    a.download = 'Avinash_Pauskar_Resume.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    appendHTML('');
    return;
  }

  // rm -rf /
  if (cmd.startsWith('rm -rf') || cmd === 'rm -rf /') {
    appendHTML(`<span class="pink bold">💀 Nice try!</span>\n<span class="muted">This portfolio is indestructible. It survived 7 hackathons.</span>\n<span class="muted">You think a little rm -rf scares it? 😤</span>`);
    appendHTML('');
    return;
  }

  // man <command>
  if (cmd.startsWith('man ')) {
    const topic = cmd.substring(4).trim();
    if (COMMANDS[topic]) {
      appendHTML(`<span class="bold highlight">MANUAL: ${topic.toUpperCase()}(1)</span>\n\n<span class="yellow">NAME</span>\n    ${topic} — display ${topic} information\n\n<span class="yellow">SYNOPSIS</span>\n    <span class="accent2">${topic}</span>\n\n<span class="yellow">DESCRIPTION</span>\n    Displays Avinash Pauskar's ${topic} details in the terminal.\n    Part of the avinash-portfolio toolkit.\n\n<span class="yellow">AUTHOR</span>\n    Written by Avinash Pauskar <avinashpauskar05@gmail.com>`);
    } else {
      appendHTML(`<span class="pink">No manual entry for ${escapeHTML(topic)}</span>`);
    }
    appendHTML('');
    return;
  }

  // git status
  if (cmd === 'git status') {
    appendHTML(`<span class="highlight">On branch main</span>\n<span class="muted">Your branch is up to date with 'origin/main'.</span>\n\n<span class="text">Changes not staged for commit:</span>\n  <span class="pink">(modified)  skills.yaml</span>     <span class="muted">← always learning</span>\n  <span class="pink">(modified)  projects/</span>       <span class="muted">← always building</span>\n\n<span class="highlight">Untracked files:</span>\n  <span class="accent2">(new)  next-big-idea.md</span>  <span class="muted">← coming soon</span>`);
    appendHTML('');
    return;
  }

  // git log
  if (cmd === 'git log') {
    appendHTML(`<span class="yellow">commit a1b2c3d</span> <span class="muted">(HEAD -> main, origin/main)</span>\nAuthor: Avinash Pauskar <avinashpauskar05@gmail.com>\nDate:   Feb 2025\n\n    <span class="text">feat: Started as SWE Trainee @ Esko</span>\n\n<span class="yellow">commit e4f5g6h</span>\nAuthor: Avinash Pauskar\nDate:   Sept 2024\n\n    <span class="text">feat: Frontend dev at Theta Dynamics (Hirehack)</span>\n\n<span class="yellow">commit i7j8k9l</span>\nAuthor: Avinash Pauskar\nDate:   2024\n\n    <span class="text">feat: Built AURA & Avalanche fest websites</span>\n\n<span class="yellow">commit m0n1o2p</span>\nAuthor: Avinash Pauskar\nDate:   2021\n\n    <span class="text">init: Started B.E. in Computer Science @ GIT</span>`);
    appendHTML('');
    return;
  }

  // docker ps
  if (cmd === 'docker ps') {
    appendHTML(`<span class="bold highlight">CONTAINER ID   IMAGE                STATUS          PORTS</span>\n<span class="muted">a1b2c3d4e5f6</span>   react-portfolio      <span class="highlight">Up 4 years</span>      0.0.0.0:3000->3000\n<span class="muted">f6e5d4c3b2a1</span>   spring-boot-api      <span class="highlight">Up 4 years</span>      0.0.0.0:8080->8080\n<span class="muted">1a2b3c4d5e6f</span>   mongo:7.0            <span class="highlight">Up 4 years</span>      0.0.0.0:27017->27017\n<span class="muted">6f5e4d3c2b1a</span>   nginx:latest         <span class="highlight">Up 4 years</span>      0.0.0.0:80->80`);
    appendHTML('');
    return;
  }

  // exit
  if (cmd === 'exit' || cmd === 'quit' || cmd === 'logout') {
    appendHTML(`<span class="muted">logout</span>\n<span class="yellow">Thanks for visiting! 👋</span>\n<span class="muted">Connection to avinash-portfolio closed.</span>\n\n<span class="text">📧 </span><a href="mailto:avinashpauskar05@gmail.com">avinashpauskar05@gmail.com</a>\n<span class="text">🔗 </span><a href="https://github.com/Avinash-Pauskar" target="_blank">github.com/Avinash-Pauskar</a>\n<span class="text">🔗 </span><a href="https://linkedin.com/in/avinash-p05" target="_blank">linkedin.com/in/avinash-p05</a>`);
    appendHTML('');
    return;
  }

  // ── Fallback ──
  appendHTML(`<span class="pink">Command not found: <span class="bold">${escapeHTML(cmd)}</span></span>\nType <span class="accent2 bold">help</span> to see available commands.`);
  appendHTML('');
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Event Listeners ───────────────────────────────────────
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    processCommand(val);
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = commandHistory[historyIndex];
    }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      input.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      input.value = '';
    }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value.trim().toLowerCase();
    const allCmds = [...Object.keys(COMMANDS), 'cat', 'echo', 'cowsay', 'sudo', 'uname', 'uname -a', 'pip list', 'npm list', 'npm ls', 'apt list', 'brew list', 'wget resume', 'rm -rf /', 'man', 'git status', 'git log', 'docker ps', 'exit'];
    const matches = allCmds.filter(c => c.startsWith(partial));
    if (matches.length === 1) {
      input.value = matches[0];
    } else if (matches.length > 1 && partial.length > 0) {
      appendHTML(`<span class="prompt-prefix">visitor@avinash:~$</span> <span class="cmd-text">${escapeHTML(input.value)}</span>`);
      appendHTML(`<span class="muted">${matches.join('  ')}</span>`);
    }
  }
});

// Click anywhere to focus input
terminal.addEventListener('click', () => input.focus());

function restoreTerminal() {
  terminalWindow.hidden = false;
  terminalWindow.classList.remove('minimized');
  dockTerminal.classList.add('active');
  input.focus();
}

minimizeButton.addEventListener('click', () => {
  terminalWindow.classList.remove('maximized');
  terminalWindow.classList.add('minimized');
});

maximizeButton.addEventListener('click', () => {
  restoreTerminal();
  terminalWindow.classList.toggle('maximized');
  maximizeButton.textContent = terminalWindow.classList.contains('maximized') ? '❐' : '□';
});

closeButton.addEventListener('click', () => {
  terminalWindow.hidden = true;
  dockTerminal.classList.remove('active');
});

dockTerminal.addEventListener('click', () => {
  if (terminalWindow.hidden || terminalWindow.classList.contains('minimized')) restoreTerminal();
  else minimizeButton.click();
});

function updateDesktopClock() {
  document.getElementById('desktop-clock').textContent = new Intl.DateTimeFormat([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date());
}
updateDesktopClock();
setInterval(updateDesktopClock, 30000);

document.querySelector('.quick-actions').addEventListener('click', (event) => {
  const button = event.target.closest('[data-command]');
  if (!button || input.disabled) return;
  processCommand(button.dataset.command);
  input.focus();
});

document.querySelector('.desktop-icons').addEventListener('click', (event) => {
  const icon = event.target.closest('[data-command]');
  if (!icon || input.disabled) return;
  restoreTerminal();
  processCommand(icon.dataset.command);
  input.focus();
});

document.querySelector('.ubuntu-dock').addEventListener('click', (event) => {
  const app = event.target.closest('.dock-icon');
  if (!app || app === dockTerminal || input.disabled) return;
  restoreTerminal();
  processCommand(`sudo launch ${app.title || 'application'}`);
});

// ── Boot Sequence ─────────────────────────────────────────
function boot() {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lines = [
    { text: '<span class="muted">[system] Initializing terminal...</span>', delay: 0 },
    { text: '<span class="muted">[system] Loading portfolio data...</span>', delay: 400 },
    { text: '<span class="muted">[system] Connection established ✓</span>', delay: 800 },
    { text: '', delay: 1000 },
    { text: WELCOME, delay: 1200 }
  ];

  input.disabled = true;

  lines.forEach(({ text, delay }) => {
    setTimeout(() => {
      appendHTML(text);
      if (delay === lines[lines.length - 1].delay) {
        input.disabled = false;
        input.focus();
      }
    }, reduceMotion ? 0 : delay);
  });
}

boot();
</script>
